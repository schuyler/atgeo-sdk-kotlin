name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every commit on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: build (JDK ${{ matrix.java }})
    needs: wrapper-validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      # Tests plus the Android API 24 check (animalsniffer).
      - run: ./gradlew build

  android-sample:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # A separate Gradle build that consumes the library via includeBuild("..").
      - run: ./gradlew -p android-sample assembleDebug

  # The vendored fixtures and lexicons are what their SOURCE files say (atgeo-sdk-js#34). The script is
  # fetched at a pinned commit, so a change to it reaches this repository only when the pin moves. A pin
  # that has fallen behind its upstream is a warning annotation, not a failure.
  fixtures:
    runs-on: ubuntu-latest
    env:
      CHECK_FIXTURES_REF: b420aabc01085970ee33701405de8bb88265c04c
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/check-fixtures.sh" \
            "https://raw.githubusercontent.com/schuyler/atgeo-sdk-js/$CHECK_FIXTURES_REF/scripts/check-fixtures.sh"
          bash "$RUNNER_TEMP/check-fixtures.sh" --fixtures src/test/resources/fixtures
