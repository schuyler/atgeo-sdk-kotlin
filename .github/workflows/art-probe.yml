# Throwaway: measures parsed-tile heap on ART. Branch measure/art-heap only; never merged.
name: ART heap probe

on:
  push:
    branches: [measure/art-heap]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew -p android-sample connectedDebugAndroidTest || true
            adb logcat -d -s PROBE:I TestRunner:* AndroidRuntime:E art:* | tee probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-api${{ matrix.api }}
          path: |
            probe.txt
            android-sample/app/build/outputs/androidTest-results/
